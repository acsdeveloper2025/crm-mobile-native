name: iOS Build Smoke Test

# Stage 1 of iOS CI: verifies the iOS build still compiles end-to-end
# on every push/tag. Produces an unsigned simulator .app artifact —
# NOT installable on physical iPhones.
#
# Stage 2 (signed IPA via Apple Developer Program) is documented in
# docs/ios-distribution-options.md and gated behind enrollment.

on:
  push:
    tags:
      - "v*"
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    paths:
      - "ios/**"
      - "package.json"
      - "package-lock.json"
      - "patches/**"
      - "App.tsx"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag to publish the simulator .app.zip to (e.g. v1.0.57). Leave blank for non-release smoke tests."
        required: false
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  build-simulator-app:
    runs-on: macos-15
    timeout-minutes: 45
    # `publish-to-release` step below needs write access on tag pushes
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Node version
        id: node-version
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .nvmrc ]]; then
            echo "version=$(cat .nvmrc | tr -d 'v\n\r ')" >> "$GITHUB_OUTPUT"
          else
            echo "version=22" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: "npm"

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: .

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Pod install
        working-directory: ios
        run: bundle exec pod install --repo-update

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: List available simulators
        run: xcrun simctl list runtimes available | head -20

      - name: Build app for iOS Simulator
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace CrmMobileNative.xcworkspace \
            -scheme CrmMobileNative \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | xcbeautify || {
              echo "::error::iOS build failed; full log follows"
              tail -200 build.log
              exit 1
            }

      - name: Verify .app produced
        working-directory: ios
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Debug-iphonesimulator/CrmMobileNative.app"
          test -d "$APP_PATH" || { echo "::error::$APP_PATH not found"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP_PATH/Info.plist"
          test -f "$APP_PATH/GoogleService-Info.plist" || { echo "::error::GoogleService-Info.plist missing from .app bundle"; exit 1; }
          test -f "$APP_PATH/Ionicons.ttf" || { echo "::error::Ionicons.ttf missing from .app bundle"; exit 1; }
          test -f "$APP_PATH/AppIcon60x60@2x.png" || { echo "::error::Generated app icon missing"; exit 1; }
          echo "::notice::iOS simulator .app build verified."

      - name: Derive version name for tag pushes
        id: version
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="${RELEASE_TAG#v}"
          if [[ "$VERSION_NAME" == "$RELEASE_TAG" || -z "$VERSION_NAME" ]]; then
            VERSION_NAME="$(node -p "require('./package.json').version")"
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Zip simulator .app
        working-directory: ios/build/Build/Products/Debug-iphonesimulator
        run: |
          set -euo pipefail
          if [[ -n "${{ steps.version.outputs.version_name || '' }}" ]]; then
            ZIP_NAME="crm-mobile-native-v${{ steps.version.outputs.version_name }}-simulator.app.zip"
          else
            ZIP_NAME="CrmMobileNative-simulator.app.zip"
          fi
          ditto -c -k --sequesterRsrc --keepParent CrmMobileNative.app "$ZIP_NAME"
          shasum -a 256 "$ZIP_NAME" > "$ZIP_NAME.sha256"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Upload simulator .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: |
            ios/build/Build/Products/Debug-iphonesimulator/${{ env.ZIP_NAME }}
            ios/build/Build/Products/Debug-iphonesimulator/${{ env.ZIP_NAME }}.sha256
          retention-days: 14

      # Attach the simulator .app.zip to the GitHub Release on tag pushes
      # (or manual workflow_dispatch with a release_tag). This is the SAME
      # release the Android workflow publishes APK + AAB to. The .app.zip
      # is NOT an installable IPA — it's a Mac-simulator build. Real iOS
      # IPA distribution requires Apple Developer enrollment; see
      # docs/ios-distribution-options.md.
      - name: Attach simulator .app.zip to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          append_body: true
          body: |
            ## iOS Simulator Build
            - `${{ env.ZIP_NAME }}` — unsigned `.app` bundle for iOS Simulator on Mac (Debug config).
            - **Not installable on physical iPhones** — requires Apple Developer Program enrollment for a signed IPA.
            - See `docs/ios-distribution-options.md` for the upgrade path.
          files: |
            ios/build/Build/Products/Debug-iphonesimulator/${{ env.ZIP_NAME }}
            ios/build/Build/Products/Debug-iphonesimulator/${{ env.ZIP_NAME }}.sha256
